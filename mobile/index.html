<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#284A4F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Taesula" />
    <title>Taesula</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- 인터넷이 없으면 시스템 글꼴로 대체됩니다 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/app.css" />
    <style>
      .splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #284a4f;
        transition:
          opacity 0.45s ease,
          visibility 0.45s;
      }
      .splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 36px;
        margin-top: -24px;
      }
      .splash-logo rect {
        transform-box: fill-box;
        transform-origin: center;
        animation: splash-tile 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        animation-delay: calc(var(--i) * 55ms);
      }
      .splash-logo .f {
        fill: #ffffff;
      }
      .splash-logo .o {
        fill: none;
        stroke: #6fa8ad;
        stroke-width: 2;
      }
      .splash-logo .m {
        fill: #a6e3df;
      }

      .splash-title {
        color: #ffffff;
        font-family: "IBM Plex Sans KR", system-ui, sans-serif;
        font-weight: 700;
        font-size: 32px;
        letter-spacing: 0.38em;
        padding-left: 0.38em; /* 글자 간격 때문에 오른쪽으로 쏠리는 것 보정 */
        animation: splash-fade 0.5s ease 0.45s both;
      }
      .splash-foot {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: calc(env(safe-area-inset-bottom) + 64px);
        text-align: center;
        font-family: "IBM Plex Sans KR", system-ui, sans-serif;
        animation: splash-fade 0.5s ease 0.6s both;
      }
      .splash-sida {
        color: #8ed3d0;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.3em;
        padding-left: 0.3em;
      }
      .splash-sub {
        margin-top: 10px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 12px;
      }

      @keyframes splash-tile {
        from {
          opacity: 0;
          transform: scale(0.6);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes splash-fade {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash * {
          animation: none !important;
        }
        .splash {
          transition: opacity 0.2s;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash" id="splash" aria-hidden="true">
      <div class="splash-center">
        <svg class="splash-logo" viewBox="0 0 98 98" width="98" height="98">
          <rect
            class="f"
            style="--i: 0"
            x="0"
            y="0"
            width="28"
            height="28"
            rx="6"
          />
          <rect
            class="f"
            style="--i: 1"
            x="35"
            y="0"
            width="28"
            height="28"
            rx="6"
          />
          <rect
            class="f"
            style="--i: 2"
            x="70"
            y="0"
            width="28"
            height="28"
            rx="6"
          />
          <rect
            class="o"
            style="--i: 3"
            x="1"
            y="36"
            width="26"
            height="26"
            rx="5"
          />
          <rect
            class="f"
            style="--i: 4"
            x="35"
            y="35"
            width="28"
            height="28"
            rx="6"
          />
          <rect
            class="o"
            style="--i: 5"
            x="71"
            y="36"
            width="26"
            height="26"
            rx="5"
          />
          <rect
            class="o"
            style="--i: 6"
            x="1"
            y="71"
            width="26"
            height="26"
            rx="5"
          />
          <rect
            class="m"
            style="--i: 7"
            x="35"
            y="70"
            width="28"
            height="28"
            rx="6"
          />
          <rect
            class="o"
            style="--i: 8"
            x="71"
            y="71"
            width="26"
            height="26"
            rx="5"
          />
        </svg>
        <div class="splash-title">TAESULA</div>
      </div>
      <div class="splash-foot">
        <div class="splash-sida">SIDA</div>
        <div class="splash-sub">Support and Intelligent Delivery Assistant</div>
      </div>
    </div>
    <div class="app">
      <header class="appbar" id="appbar"></header>
      <main class="screen" id="screen" tabindex="-1"></main>
    </div>

    <nav class="tabbar" aria-label="주 메뉴">
      <div class="tabbar-inner" id="tabbar"></div>
    </nav>

    <div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>

    <script>
      // app.js가 늦거나 예전 버전이어도 5초 뒤에는 시작 화면을 걷어낸다
      setTimeout(() => {
        const s = document.getElementById("splash");
        if (s) s.remove();
      }, 5000);
    </script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
